<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="media-queriesin.css">
</head>

<body>
    <header>
        <div class="site-header">
            <div class="logo">
                <img src="logo.png.png" alt="">
                <h1>YMNM</h1>
            </div>

            <nav class="main-nav" aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="services.html">Services</a>
                <a href="menu.html">Menu</a>
                <a href="about.html">About us</a>
            </nav>

            <div class="header-actions">
                <button class="icon-btn" aria-label="Search">
                    <img src="ic_baseline-search.svg" alt="">
                </button>

                <button class="icon-btn" aria-label="Store">
                    <a href="menu.html">
                        <img src="Group.svg" alt="">
                    </a>
                </button>


                <a href="signup.html"><button class="login-btn">Login</button></a>
            </div>
        </div>
    </header>

    <section class="signup">
        <div class="left">
            <h1>YMMM</h1>
            <p>Welcome to YMMM! <br>
                "Hot, fresh, and
                fast—delivered to <br>
                your
                door! 🍕🚀 Order now!"
            </p>
        </div>

        <div class="right">
            <h1>Create Account</h1>

            <div class="btn-sign">
                <button class="sign-cta"><img src="logos_google-icon.png" alt=""><a href="google.com">Sign up with
                        Google</a>
                </button>
                <button class="sign-cta"><img src="logos_facebook.png" alt=""><a href="facebook.com">Sign up with
                        Facebook</a>
                </button> 
            </div>


            <p class="dema">-OR-</p>


            <div class="input">

                <label for="name">Full Name</label>
                <input id="name" type="text" placeholder="Your Full name bastard">


                <label for="add">Email Address</label>
                <input id="add" type="email" placeholder="Your Email bastard">


                <label for="pass">Password</label>
                <input id="pass" type="password" placeholder="Your Password bastard">

                <button><a href="">Sign Up</a></button>

                <p>Already have an account? <span>Login</span></p>

            </div>



        </div>
    </section>
